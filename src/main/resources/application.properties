# Application Configuration for Smart Attendance Monitoring System
spring.application.name=smart-attendance-monitoring
server.port=${PORT:8080}

# Database Configuration with Environment Variable Support (H2 in-memory default fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:attendance_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Enable static resources serving
spring.web.resources.static-locations=classpath:/static/

